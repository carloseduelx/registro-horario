<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Horas">
<meta name="theme-color" content="#0f5132">
<title>Registro de Horas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --p:#0f5132;--p2:#16a34a;--p3:#22c55e;
  --grad:linear-gradient(135deg,#0f5132 0%,#16a34a 100%);
  --acc:#f59e0b;--acc-l:#fef3c7;--acc-d:#92400e;
  --dan:#dc2626;--dan-l:#fee2e2;
  --ok:#16a34a;--ok-l:#dcfce7;
  --bd:#e5e7eb;--bg:#ffffff;--bg2:#f9fafb;--mu:#6b7280;--text:#111827;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.1);
  --radius:16px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1e;--bg2:#111;--text:#f5f5f7;--mu:#98989d;--bd:#38383a;
    --acc-l:#3a2e00;--ok-l:#0d2818;--dan-l:#2d1212;--shadow:0 1px 3px rgba(0,0,0,.4);}
  body{background:#000}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;padding-bottom:90px}
.header-bar{background:var(--grad);color:#fff;padding:20px 20px 24px;position:relative;overflow:hidden}
.header-bar::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:rgba(255,255,255,.08);border-radius:50%}
.header-bar::before{content:"";position:absolute;right:40px;bottom:-50px;width:90px;height:90px;background:rgba(255,255,255,.06);border-radius:50%}
.header-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.header-title{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.3px}
.header-pend-label{font-size:12px;opacity:.8;margin-top:14px;position:relative;z-index:1}
.header-pend{font-size:34px;font-weight:800;letter-spacing:-1px;position:relative;z-index:1;line-height:1.1}
.header-sub{font-size:12px;opacity:.75;margin-top:4px;position:relative;z-index:1}
.sync-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(10px)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#86efac}
.sync-dot.syncing{background:#fde047;animation:pulse 1s infinite}
.sync-dot.offline{background:#fca5a5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nav{display:flex;background:var(--bg);margin:-16px 16px 0;border-radius:var(--radius);box-shadow:var(--shadow-lg);position:relative;z-index:10;overflow:hidden;padding:5px}
.nav button{flex:1;padding:11px 2px;font-size:11px;font-weight:600;border:none;background:none;color:var(--mu);cursor:pointer;border-radius:11px;transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:17px}
.nav button.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(15,81,50,.3)}
.sec{display:none;padding:16px}
.sec.active{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--bg);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin-bottom:16px;display:flex;align-items:center;gap:6px}
.fr{margin-bottom:14px}
.fr label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;font-weight:600}
.fr input,.fr select{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:12px;font-size:16px;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;transition:all .2s}
.fr input:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(22,163,74,.12)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:13px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .18s;text-align:center;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(15,81,50,.3)}
.btn-sm{padding:9px 14px;font-size:12.5px;border-radius:10px;width:auto}
.btn-g{background:var(--bg2);border:1.5px solid var(--bd);color:var(--text)}
.btn-ok{background:var(--ok-l);color:var(--ok)}
.btn-dan{background:var(--dan-l);color:var(--dan)}
.prev{background:var(--grad);border-radius:14px;padding:18px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden}
.prev::after{content:"";position:absolute;right:-20px;bottom:-30px;width:100px;height:100px;background:rgba(255,255,255,.1);border-radius:50%}
.prev-big{font-size:32px;font-weight:800;letter-spacing:-.5px;position:relative;z-index:1}
.prev-sub{font-size:12px;opacity:.85;margin-top:3px;position:relative;z-index:1}
.prev-right{text-align:right;position:relative;z-index:1}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat .val{font-size:21px;font-weight:800;letter-spacing:-.5px}
.stat .lbl{font-size:11px;color:var(--mu);margin-top:4px;font-weight:600}
.day-item{background:var(--bg);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--acc);transition:all .2s}
.day-item.paid{border-left-color:var(--p3)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.ddate{font-size:15px;font-weight:700}
.dtotal{font-size:18px;font-weight:800;color:var(--p);letter-spacing:-.5px}
.ddetail{font-size:12px;color:var(--mu);margin-top:2px}
.dact{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-top:5px}
.b-ok{background:var(--ok-l);color:var(--ok)}
.b-pend{background:var(--acc-l);color:var(--acc-d)}
.empty{text-align:center;padding:40px 20px;color:var(--mu);font-size:14px}
.empty .ic{font-size:40px;display:block;margin-bottom:10px;opacity:.5}
.fil-row{display:flex;gap:10px;margin-bottom:16px}
.fil-row select{flex:1;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;font-weight:600}
.big-num{text-align:center;padding:8px}
.big-num .monto{font-size:40px;font-weight:800;color:var(--p);letter-spacing:-1.5px}
.big-num .label{font-size:13px;color:var(--mu);font-weight:600}
.cloud-bar{background:var(--ok-l);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ok);font-weight:600}
.month-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.month-row:last-child{border-bottom:none}
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-wrap.open{display:flex;animation:fadeBg .25s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg);border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:460px;max-height:92vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:40px;height:5px;background:var(--bd);border-radius:3px;margin:0 auto 18px}
.modal h3{font-size:19px;font-weight:800;margin-bottom:6px}
.modal-act{display:flex;gap:10px;margin-top:18px}
.modal-act button{flex:1}
.confirm-msg{font-size:14px;color:var(--mu);line-height:1.6;margin-bottom:4px}
.confirm-box{background:var(--bg2);border-radius:12px;padding:14px;margin:14px 0}
.confirm-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.confirm-row .k{color:var(--mu)}
.confirm-row .v{font-weight:700}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:13px 22px;border-radius:30px;font-size:13.5px;font-weight:700;z-index:999;opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:30px;color:var(--mu);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header-bar">
    <div class="header-top">
      <span class="header-title">⏱ REGISTRO DE HORAS</span>
      <span class="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-txt">En la nube</span></span>
    </div>
    <div class="header-pend-label">Pendiente de cobro</div>
    <div class="header-pend" id="hdr-pend">0,00 €</div>
    <div class="header-sub" id="hdr-sub">Cargando...</div>
  </div>
  <div class="nav">
    <button class="active" onclick="showTab('reg')"><span class="ic">➕</span>Registrar</button>
    <button onclick="showTab('lst')"><span class="ic">📋</span>Listado</button>
    <button onclick="showTab('res')"><span class="ic">📊</span>Resumen</button>
    <button onclick="showTab('cob')"><span class="ic">💰</span>Cobros</button>
  </div>
  <div id="tab-reg" class="sec active">
    <div class="card">
      <div class="card-title">📝 Nuevo día de trabajo</div>
      <div class="fr"><label>Fecha</label><input type="date" id="inp-fecha"></div>
      <div class="r2">
        <div class="fr"><label>Horas trabajadas</label><input type="number" id="inp-horas" placeholder="8" step="0.25" min="0" max="24" oninput="calcPrev()"></div>
        <div class="fr"><label>Horas extra</label><input type="number" id="inp-extra" placeholder="0" step="0.25" min="0" max="24" oninput="calcPrev()"></div>
      </div>
      <div class="r2">
        <div class="fr"><label>€/hora normal</label><input type="number" id="inp-precio" placeholder="10.00" step="0.01" min="0" oninput="calcPrev()"></div>
        <div class="fr"><label>€/hora extra</label><input type="number" id="inp-precio-extra" placeholder="0.00" step="0.01" min="0" oninput="calcPrev()"></div>
      </div>
      <div class="fr"><label>Notas</label><input type="text" id="inp-notas" placeholder="Opcional"></div>
      <div class="prev">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="prev-big" id="prev-total">0,00 €</div>
            <div class="prev-sub" id="prev-det">Introduce las horas</div>
          </div>
          <div class="prev-right">
            <div style="font-size:22px;font-weight:800" id="prev-htotal">0h</div>
            <div style="font-size:11px;opacity:.85" id="prev-hdet"></div>
          </div>
        </div>
      </div>
      <button class="btn btn-p" onclick="pedirGuardarDia()">☁️ Guardar día</button>
    </div>
    <div class="card">
      <div class="card-title">⚙️ Precios por defecto</div>
      <div class="r2">
        <div class="fr"><label>€/hora normal</label><input type="number" id="cfg-precio" placeholder="10.00" step="0.01" min="0"></div>
        <div class="fr"><label>€/hora extra</label><input type="number" id="cfg-extra" placeholder="15.00" step="0.01" min="0"></div>
      </div>
      <button class="btn btn-g btn-sm" onclick="guardarConfig()">Guardar configuración</button>
    </div>
  </div>
  <div id="tab-lst" class="sec">
    <div class="fil-row">
      <select id="fil-mes" onchange="renderListado()"><option value="">Todos los meses</option></select>
      <select id="fil-est" onchange="renderListado()">
        <option value="">Todos</option>
        <option value="cobrado">Cobrados</option>
        <option value="pendiente">Pendientes</option>
      </select>
    </div>
    <div id="lst-cont"><div class="loading">☁️ Cargando datos...</div></div>
  </div>
  <div id="tab-res" class="sec">
    <div class="fil-row">
      <select id="res-periodo" onchange="renderResumen()">
        <option value="semana">Esta semana</option>
        <option value="mes" selected>Este mes</option>
        <option value="año">Este año</option>
        <option value="todo">Todo</option>
      </select>
    </div>
    <div id="res-cont"><div class="loading">☁️ Cargando datos...</div></div>
  </div>
  <div id="tab-cob" class="sec">
    <div class="card">
      <div class="card-title">💰 Registrar cobro</div>
      <div class="fr">
        <label>Tipo</label>
        <select id="cob-tipo" onchange="tipoCobro()">
          <option value="hasta">Cobrado hasta una fecha</option>
          <option value="dia">Día específico cobrado</option>
          <option value="rango">Rango de fechas</option>
        </select>
      </div>
      <div class="r2">
        <div class="fr"><label id="cob-lbl">Cobrado hasta</label><input type="date" id="cob-f1"></div>
        <div class="fr" id="cob-f2-wrap" style="display:none"><label>Hasta</label><input type="date" id="cob-f2"></div>
      </div>
      <div class="fr"><label>Importe cobrado (€)</label><input type="number" id="cob-imp" placeholder="0.00" step="0.01" min="0"></div>
      <div class="fr"><label>Notas</label><input type="text" id="cob-notas" placeholder="Ej: transferencia, efectivo..."></div>
      <button class="btn btn-p" onclick="pedirRegistrarCobro()">Registrar cobro</button>
    </div>
    <div class="card">
      <div class="card-title">📈 Balance total</div>
      <div id="bal-cont"></div>
    </div>
    <div class="card">
      <div class="card-title">🧾 Historial de cobros</div>
      <div id="cob-hist"></div>
    </div>
  </div>
</div>
<div class="modal-wrap" id="modal-confirm">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="confirm-title">¿Confirmar?</h3>
    <div class="confirm-msg" id="confirm-text"></div>
    <div id="confirm-detail"></div>
    <div class="modal-act">
      <button class="btn btn-g" onclick="cerrarConfirm()">Cancelar</button>
      <button class="btn btn-p" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>
<div class="modal-wrap" id="modal-edit">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>✏️ Editar día</h3>
    <div class="r2">
      <div class="fr"><label>Horas normales</label><input type="number" id="ed-h" step="0.25" min="0"></div>
      <div class="fr"><label>Horas extra</label><input type="number" id="ed-he" step="0.25" min="0"></div>
    </div>
    <div class="r2">
      <div class="fr"><label>€/hora normal</label><input type="number" id="ed-p" step="0.01" min="0"></div>
      <div class="fr"><label>€/hora extra</label><input type="number" id="ed-pe" step="0.01" min="0"></div>
    </div>
    <div class="fr"><label>Notas</label><input type="text" id="ed-n"></div>
    <div class="modal-act">
      <button class="btn btn-g" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-p" onclick="pedirGuardarEdit()">Guardar cambios</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDXyGq4jNvWBHMr6-Z3YulrsLOJrnbzjKc",
  authDomain: "registro-horas-f966d.firebaseapp.com",
  projectId: "registro-horas-f966d",
  storageBucket: "registro-horas-f966d.firebasestorage.app",
  messagingSenderId: "961063355533",
  appId: "1:961063355533:web:d6921604123dc23d74cec4"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DIAS_SEM = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES_N = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
let diasCache = [], cobrosCache = [], cfg = { precio: 10, extra: 15 };
let editId = null, confirmAction = null;
function setSyncDot(s){const d=document.getElementById('sync-dot');d.className='sync-dot'+(s==='syncing'?' syncing':s==='offline'?' offline':'');document.getElementById('sync-txt').textContent=s==='syncing'?'Guardando':s==='offline'?'Sin conexión':'En la nube';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function eur(n){return (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function hText(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return mm>0?hh+'h '+mm+'m':hh+'h';}
function calcTotal(h,he,p,pe){return (h*p)+(he*(pe>0?pe:p));}
function updHeader(){
  const hoy=new Date().toISOString().slice(0,7);
  const dm=diasCache.filter(d=>d.fecha.startsWith(hoy)).length;
  const totG=diasCache.reduce((s,d)=>s+d.total,0);
  const totC=cobrosCache.reduce((s,c)=>s+(c.imp||0),0);
  const pend=Math.max(0,totG-totC);
  document.getElementById('hdr-pend').textContent=eur(pend);
  document.getElementById('hdr-sub').textContent=dm+' días este mes · '+eur(totG)+' ganado total';
}
window.calcPrev=function(){
  const h=parseFloat(document.getElementById('inp-horas').value)||0;
  const he=parseFloat(document.getElementById('inp-extra').value)||0;
  const p=parseFloat(document.getElementById('inp-precio').value)||cfg.precio;
  const pe=parseFloat(document.getElementById('inp-precio-extra').value)||cfg.extra;
  const total=calcTotal(h,he,p,pe);
  document.getElementById('prev-total').textContent=eur(total);
  document.getElementById('prev-htotal').textContent=hText(h+he);
  if(he>0){
    document.getElementById('prev-det').textContent=hText(h)+' × '+p+'€ + '+hText(he)+' extra × '+pe+'€';
    document.getElementById('prev-hdet').textContent=hText(h)+' norm + '+hText(he)+' extra';
  }else{
    document.getElementById('prev-det').textContent=h>0?h+'h × '+p+' €/h':'Introduce las horas';
    document.getElementById('prev-hdet').textContent='';
  }
}
function pedirConfirmacion(titulo,texto,detalleHTML,accion,btnTexto){
  document.getElementById('confirm-title').textContent=titulo;
  document.getElementById('confirm-text').textContent=texto;
  document.getElementById('confirm-detail').innerHTML=detalleHTML||'';
  document.getElementById('confirm-ok').textContent=btnTexto||'Confirmar';
  confirmAction=accion;
  document.getElementById('modal-confirm').classList.add('open');
}
window.cerrarConfirm=function(){document.getElementById('modal-confirm').classList.remove('open');confirmAction=null;}
document.getElementById('confirm-ok').addEventListener('click',()=>{if(confirmAction){const a=confirmAction;confirmAction=null;document.getElementById('modal-confirm').classList.remove('open');a();}});
async function cargarConfig(){
  try{const snap=await getDoc(doc(db,'config','general'));
    if(snap.exists()){cfg=snap.data();
      document.getElementById('cfg-precio').value=cfg.precio;
      document.getElementById('cfg-extra').value=cfg.extra;
      document.getElementById('inp-precio').value=cfg.precio;
      document.getElementById('inp-precio-extra').value=cfg.extra;}
  }catch(e){}
}
window.guardarConfig=async function(){
  const p=parseFloat(document.getElementById('cfg-precio').value);
  const pe=parseFloat(document.getElementById('cfg-extra').value);
  if(isNaN(p)){alert('Precio inválido');return;}
  cfg={precio:p,extra:pe||0};setSyncDot('syncing');
  try{await setDoc(doc(db,'config','general'),cfg);setSyncDot('ok');
    document.getElementById('inp-precio').value=p;
    document.getElementById('inp-precio-extra').value=pe||'';
    toast('✅ Configuración guardada');
  }catch(e){setSyncDot('offline');toast('❌ Error al guardar');}
}
window.pedirGuardarDia=function(){
  const fecha=document.getElementById('inp-fecha').value;
  const h=parseFloat(document.getElementById('inp-horas').value)||0;
  const he=parseFloat(document.getElementById('inp-extra').value)||0;
  const p=parseFloat(document.getElementById('inp-precio').value)||cfg.precio;
  const pe=parseFloat(document.getElementById('inp-precio-extra').value)||cfg.extra;
  if(!fecha){alert('Introduce la fecha');return;}
  if(h<=0&&he<=0){alert('Introduce al menos las horas trabajadas');return;}
  const total=calcTotal(h,he,p,pe);
  const existe=diasCache.find(d=>d.fecha===fecha);
  const f=new Date(fecha+'T12:00:00');
  const fd=DIAS_SEM[f.getDay()]+' '+fecha.split('-').reverse().join('/');
  const det='<div class="confirm-box">'+
    '<div class="confirm-row"><span class="k">Fecha</span><span class="v">'+fd+'</span></div>'+
    '<div class="confirm-row"><span class="k">Horas</span><span class="v">'+hText(h)+(he>0?' + '+hText(he)+' extra':'')+'</span></div>'+
    '<div class="confirm-row"><span class="k">Total del día</span><span class="v" style="color:var(--p)">'+eur(total)+'</span></div></div>';
  pedirConfirmacion(existe?'¿Sobreescribir día?':'¿Guardar este día?',
    existe?'Ya existe un registro para esta fecha. Se reemplazará por el nuevo.':'Se guardará en la nube y estará disponible en todos tus dispositivos.',
    det,()=>guardarDia(fecha,h,he,p,pe,total),'☁️ Guardar');
}
async function guardarDia(fecha,h,he,p,pe,total){
  const notas=document.getElementById('inp-notas').value;
  const dia={fecha,h,he,p,pe,notas,total,cobrado:false};
  setSyncDot('syncing');
  try{await setDoc(doc(db,'dias',fecha),dia);setSyncDot('ok');
    document.getElementById('inp-horas').value='';
    document.getElementById('inp-extra').value='';
    document.getElementById('inp-notas').value='';
    calcPrev();
    toast('✅ '+eur(total)+' guardado');
  }catch(e){setSyncDot('offline');toast('❌ Error. Comprueba la conexión');}
}
function estadoDia(d){
  if(d.cobrado)return 'cobrado';
  return cobrosCache.some(c=>{
    if(c.tipo==='hasta')return d.fecha<=c.f1;
    if(c.tipo==='dia')return d.fecha===c.f1;
    if(c.tipo==='rango')return d.fecha>=c.f1&&d.fecha<=(c.f2||c.f1);
    return false;
  })?'cobrado':'pendiente';
}
function poblarFiltros(){
  const meses=[...new Set(diasCache.map(d=>d.fecha.slice(0,7)))].sort().reverse();
  const sel=document.getElementById('fil-mes');const act=sel.value;
  sel.innerHTML='<option value="">Todos los meses</option>';
  meses.forEach(m=>{const parts=m.split('-');const o=document.createElement('option');
    o.value=m;o.textContent=MESES_N[parseInt(parts[1])]+' '+parts[0];
    if(m===act)o.selected=true;sel.appendChild(o);});
}
window.renderListado=function(){
  const fm=document.getElementById('fil-mes').value;
  const fe=document.getElementById('fil-est').value;
  let dias=[...diasCache].sort((a,b)=>a.fecha>b.fecha?-1:1);
  if(fm)dias=dias.filter(d=>d.fecha.startsWith(fm));
  if(fe)dias=dias.filter(d=>estadoDia(d)===fe);
  const cont=document.getElementById('lst-cont');
  if(!dias.length){cont.innerHTML='<div class="empty"><span class="ic">📋</span>No hay registros con estos filtros</div>';return;}
  cont.innerHTML=dias.map(d=>{
    const est=estadoDia(d);
    const f=new Date(d.fecha+'T12:00:00');
    const fd=DIAS_SEM[f.getDay()]+' '+d.fecha.split('-').reverse().join('/');
    return '<div class="day-item '+(est==='cobrado'?'paid':'')+'">'+
      '<div class="dh"><div>'+
      '<div class="ddate">'+fd+'</div>'+
      '<div class="ddetail">'+hText(d.h)+' normales'+(d.he>0?' + '+hText(d.he)+' extra':'')+' · '+d.p+'€/h'+(d.he>0?' | '+d.pe+'€/h extra':'')+'</div>'+
      (d.notas?'<div style="font-size:11px;color:var(--mu);margin-top:3px">📝 '+d.notas+'</div>':'')+
      '<span class="badge '+(est==='cobrado'?'b-ok':'b-pend')+'">'+(est==='cobrado'?'✓ Cobrado':'⏳ Pendiente')+'</span>'+
      '</div><div style="text-align:right"><div class="dtotal">'+eur(d.total)+'</div></div></div>'+
      '<div class="dact">'+
      '<button class="btn btn-g btn-sm" onclick="abrirEdit(\''+d.fecha+'\')">✏️ Editar</button>'+
      (est!=='cobrado'?'<button class="btn btn-ok btn-sm" onclick="pedirMarcarCob(\''+d.fecha+'\',true)">✓ Cobrado</button>':'<button class="btn btn-g btn-sm" onclick="pedirMarcarCob(\''+d.fecha+'\',false)">↩ Pendiente</button>')+
      '<button class="btn btn-dan btn-sm" onclick="pedirBorrarDia(\''+d.fecha+'\')">🗑</button>'+
      '</div></div>';
  }).join('');
}
window.renderResumen=function(){
  const per=document.getElementById('res-periodo').value;
  const hoy=new Date();let dias=[...diasCache];
  if(per==='semana'){const lun=new Date(hoy);lun.setDate(hoy.getDate()-(hoy.getDay()===0?6:hoy.getDay()-1));dias=dias.filter(d=>d.fecha>=lun.toISOString().slice(0,10));}
  else if(per==='mes')dias=dias.filter(d=>d.fecha.startsWith(hoy.toISOString().slice(0,7)));
  else if(per==='año')dias=dias.filter(d=>d.fecha.startsWith(hoy.getFullYear().toString()));
  const tot=dias.reduce((s,d)=>s+d.total,0);
  const hTot=dias.reduce((s,d)=>s+d.h+d.he,0);
  const cob=dias.filter(d=>estadoDia(d)==='cobrado').reduce((s,d)=>s+d.total,0);
  const pend=tot-cob;
  const ptexto={semana:'Esta semana',mes:'Este mes',año:'Este año',todo:'Total acumulado'};
  let desglose='';
  if(per==='todo'){
    const pm={};diasCache.forEach(d=>{const m=d.fecha.slice(0,7);if(!pm[m])pm[m]={t:0,n:0};pm[m].t+=d.total;pm[m].n++;});
    const ms=Object.keys(pm).sort().reverse();
    if(ms.length)desglose='<div class="card"><div class="card-title">📅 Por mes</div>'+ms.map(m=>{const parts=m.split('-');
      return '<div class="month-row"><div><div style="font-weight:700;font-size:14px">'+MESES_N[parseInt(parts[1])]+' '+parts[0]+'</div><div style="font-size:11px;color:var(--mu)">'+pm[m].n+' días</div></div><div style="font-weight:800;color:var(--p);font-size:16px">'+eur(pm[m].t)+'</div></div>';}).join('')+'</div>';
  }
  document.getElementById('res-cont').innerHTML=
    '<div class="cloud-bar">☁️ Datos sincronizados · seguros en cualquier dispositivo</div>'+
    '<div class="card"><div class="big-num"><div class="label">'+ptexto[per]+'</div><div class="monto">'+eur(tot)+'</div><div class="label">'+dias.length+' días · '+hText(hTot)+'</div></div></div>'+
    '<div class="stat-grid">'+
    '<div class="stat"><div class="val" style="color:var(--ok)">'+eur(cob)+'</div><div class="lbl">Cobrado</div></div>'+
    '<div class="stat"><div class="val" style="color:var(--acc)">'+eur(pend)+'</div><div class="lbl">Pendiente</div></div>'+
    '<div class="stat"><div class="val" style="color:var(--p)">'+dias.length+'</div><div class="lbl">Días</div></div>'+
    '<div class="stat"><div class="val" style="color:var(--p)">'+hText(hTot)+'</div><div class="lbl">Horas totales</div></div>'+
    '</div>'+desglose+
    '<div class="card"><div class="card-title">📤 Exportar</div><button class="btn btn-g btn-sm" onclick="exportCSV()">📄 Descargar CSV (Excel)</button></div>';
}
window.renderCobros=function(){
  const totG=diasCache.reduce((s,d)=>s+d.total,0);
  const totC=cobrosCache.reduce((s,c)=>s+(c.imp||0),0);
  const pend=Math.max(0,totG-totC);
  document.getElementById('bal-cont').innerHTML=
    '<div class="confirm-row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span class="k" style="color:var(--mu)">Total ganado</span><span class="v">'+eur(totG)+'</span></div>'+
    '<div class="confirm-row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span class="k" style="color:var(--mu)">Total cobrado</span><span class="v" style="color:var(--ok)">'+eur(totC)+'</span></div>'+
    '<div class="confirm-row" style="padding:10px 0"><span style="font-weight:700">Pendiente</span><span style="font-weight:800;font-size:17px;color:'+(pend>0?'var(--acc)':'var(--ok)')+'">'+eur(pend)+'</span></div>';
  const hist=document.getElementById('cob-hist');
  if(!cobrosCache.length){hist.innerHTML='<div style="color:var(--mu);font-size:13px;text-align:center;padding:12px">Sin cobros aún</div>';return;}
  hist.innerHTML=cobrosCache.slice().reverse().map(c=>{
    const tipo=c.tipo==='hasta'?'Hasta '+c.f1:c.tipo==='dia'?'Día '+c.f1:c.f1+' → '+c.f2;
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)"><div><div style="font-size:13px;font-weight:700">💰 '+tipo+'</div><div style="font-size:11px;color:var(--mu)">'+(c.notas||'')+'</div></div><div style="display:flex;align-items:center;gap:8px">'+(c.imp>0?'<span style="font-weight:800;color:var(--p)">'+eur(c.imp)+'</span>':'')+'<button class="btn btn-dan btn-sm" onclick="pedirBorrarCobro(\''+c.id+'\')">✕</button></div></div>';
  }).join('');
}
window.tipoCobro=function(){
  const t=document.getElementById('cob-tipo').value;
  document.getElementById('cob-lbl').textContent=t==='hasta'?'Cobrado hasta':t==='dia'?'Día cobrado':'Desde fecha';
  document.getElementById('cob-f2-wrap').style.display=t==='rango'?'block':'none';
}
window.pedirRegistrarCobro=function(){
  const tipo=document.getElementById('cob-tipo').value;
  const f1=document.getElementById('cob-f1').value;
  const f2=document.getElementById('cob-f2').value;
  const imp=parseFloat(document.getElementById('cob-imp').value)||0;
  if(!f1){alert('Selecciona una fecha');return;}
  if(tipo==='rango'&&!f2){alert('Selecciona la fecha final');return;}
  const tipoT=tipo==='hasta'?'Cobrado hasta '+f1:tipo==='dia'?'Día '+f1:'Del '+f1+' al '+f2;
  const det='<div class="confirm-box"><div class="confirm-row"><span class="k">Cobro</span><span class="v">'+tipoT+'</span></div>'+(imp>0?'<div class="confirm-row"><span class="k">Importe</span><span class="v" style="color:var(--p)">'+eur(imp)+'</span></div>':'')+'</div>';
  pedirConfirmacion('¿Registrar cobro?','Se marcará como cobrado en la nube.',det,()=>registrarCobro(tipo,f1,f2,imp),'💰 Registrar');
}
async function registrarCobro(tipo,f1,f2,imp){
  const notas=document.getElementById('cob-notas').value;
  const id='cobro_'+Date.now();
  const cobro={id,tipo,f1,f2:tipo==='rango'?f2:'',imp,notas};
  setSyncDot('syncing');
  try{await setDoc(doc(db,'cobros',id),cobro);setSyncDot('ok');
    document.getElementById('cob-f1').value='';document.getElementById('cob-f2').value='';
    document.getElementById('cob-imp').value='';document.getElementById('cob-notas').value='';
    toast('✅ Cobro registrado');
  }catch(e){setSyncDot('offline');toast('❌ Error al guardar');}
}
window.pedirMarcarCob=function(fecha,val){
  pedirConfirmacion(val?'¿Marcar como cobrado?':'¿Marcar como pendiente?',
    val?'Este día pasará a estar cobrado.':'Este día volverá a estar pendiente de cobro.','',
    ()=>marcarCob(fecha,val),val?'✓ Sí, cobrado':'↩ Sí, pendiente');
}
async function marcarCob(fecha,val){
  setSyncDot('syncing');
  try{const d=diasCache.find(x=>x.fecha===fecha);if(d){d.cobrado=val;await setDoc(doc(db,'dias',fecha),d);}setSyncDot('ok');toast('✅ Actualizado');}
  catch(e){setSyncDot('offline');}
}
window.pedirBorrarDia=function(fecha){
  pedirConfirmacion('¿Eliminar este día?','Esta acción no se puede deshacer. El registro se borrará de la nube.','',
    ()=>borrarDia(fecha),'🗑 Sí, eliminar');
}
async function borrarDia(fecha){
  setSyncDot('syncing');
  try{await deleteDoc(doc(db,'dias',fecha));setSyncDot('ok');toast('🗑 Día eliminado');}
  catch(e){setSyncDot('offline');toast('❌ Error al eliminar');}
}
window.pedirBorrarCobro=function(id){
  pedirConfirmacion('¿Eliminar este cobro?','Esta acción no se puede deshacer.','',
    ()=>borrarCobro(id),'🗑 Sí, eliminar');
}
async function borrarCobro(id){
  setSyncDot('syncing');
  try{await deleteDoc(doc(db,'cobros',id));setSyncDot('ok');toast('🗑 Cobro eliminado');}
  catch(e){setSyncDot('offline');toast('❌ Error al eliminar');}
}
window.abrirEdit=function(fecha){
  editId=fecha;const d=diasCache.find(x=>x.fecha===fecha);if(!d)return;
  document.getElementById('ed-h').value=d.h;
  document.getElementById('ed-he').value=d.he;
  document.getElementById('ed-p').value=d.p;
  document.getElementById('ed-pe').value=d.pe;
  document.getElementById('ed-n').value=d.notas||'';
  document.getElementById('modal-edit').classList.add('open');
}
window.pedirGuardarEdit=function(){
  if(!editId)return;
  const d=diasCache.find(x=>x.fecha===editId);if(!d)return;
  const h=parseFloat(document.getElementById('ed-h').value)||d.h;
  const he=parseFloat(document.getElementById('ed-he').value)||0;
  const p=parseFloat(document.getElementById('ed-p').value)||d.p;
  const pe=parseFloat(document.getElementById('ed-pe').value)||d.pe;
  const total=calcTotal(h,he,p,pe);
  const det='<div class="confirm-box"><div class="confirm-row"><span class="k">Nuevo total</span><span class="v" style="color:var(--p)">'+eur(total)+'</span></div></div>';
  pedirConfirmacion('¿Guardar cambios?','Se actualizará el registro en la nube.',det,
    ()=>guardarEdit(h,he,p,pe,total),'✓ Guardar');
}
async function guardarEdit(h,he,p,pe,total){
  const d=diasCache.find(x=>x.fecha===editId);if(!d)return;
  d.h=h;d.he=he;d.p=p;d.pe=pe;d.notas=document.getElementById('ed-n').value;d.total=total;
  setSyncDot('syncing');
  try{await setDoc(doc(db,'dias',editId),d);setSyncDot('ok');toast('✅ Día actualizado');cerrarModal();}
  catch(e){setSyncDot('offline');toast('❌ Error al guardar');}
}
window.cerrarModal=function(){document.getElementById('modal-edit').classList.remove('open');editId=null;}
window.exportCSV=function(){
  const cab=['Fecha','Día','H.Normales','H.Extra','H.Total','€/h normal','€/h extra','Total €','Estado','Notas'];
  const filas=[...diasCache].sort((a,b)=>a.fecha>b.fecha?-1:1).map(d=>{const f=new Date(d.fecha+'T12:00:00');
    return [d.fecha,DIAS_SEM[f.getDay()],d.h.toFixed(2),d.he.toFixed(2),(d.h+d.he).toFixed(2),d.p,d.pe,d.total.toFixed(2),estadoDia(d),d.notas||''].join(',');});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[cab.join(','),...filas].join('\n')],{type:'text/csv'}));a.download='registro_horas.csv';a.click();
}
window.showTab=function(tab){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  const tabs=['reg','lst','res','cob'];
  document.querySelectorAll('.nav button')[tabs.indexOf(tab)].classList.add('active');
  if(tab==='lst')renderListado();if(tab==='res')renderResumen();if(tab==='cob')renderCobros();
}
async function inicializar(){
  document.getElementById('inp-fecha').value=new Date().toISOString().slice(0,10);
  await cargarConfig();
  onSnapshot(collection(db,'dias'),snap=>{
    diasCache=snap.docs.map(d=>d.data());
    poblarFiltros();updHeader();renderListado();renderResumen();renderCobros();setSyncDot('ok');
  },err=>setSyncDot('offline'));
  onSnapshot(collection(db,'cobros'),snap=>{
    cobrosCache=snap.docs.map(d=>d.data());
    updHeader();renderListado();renderCobros();renderResumen();
  },err=>setSyncDot('offline'));
}
inicializar();
</script>
</body>
</html>
